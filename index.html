<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <script>
      // Resolve the theme synchronously, before styles or the application paint.
      (() => {
        let saved;
        try { saved = localStorage.getItem("quiet-knight-theme"); } catch {}
        const explicit = saved === "light" || saved === "dark";
        const theme = explicit ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = explicit ? theme : "system";
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === "dark" ? "#191b1e" : "#f7f7f5";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#191b1e" : "#f7f7f5";
      })();
    </script>
    <meta
      name="description"
      content="A quiet place to play, learn, and review chess. Offline, private, and free."
    />
    <title>Quiet Knight | Chess at your pace</title>
    <link rel="icon" href="%BASE_URL%icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
